name: RetailMax CI Pipeline

# Trigger the workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Enables manual triggering of the workflow from the Actions UI

jobs:
  quality-assurance:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up the correct Python environment (3.11)
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip' # Cache pip dependencies to speed up future runs

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run Code Formatting Check (Black)
      - name: Verify Formatting (Black)
        run: black --check .

      # Step 5: Run Linting Checks (Ruff)
      - name: Lint Code (Ruff)
        run: ruff check .

      # Step 6: Run Static Type Checking (Mypy)
      - name: Type Verification (Mypy)
        run: mypy .

      # Step 7: Execute Pytest Suite (26 tests)
      - name: Run Test Suite (Pytest)
        run: pytest

      # Step 8: Verify Docker Build
      - name: Verify Docker Container Build
        run: docker build -t retailmax-platform-ci:test .
